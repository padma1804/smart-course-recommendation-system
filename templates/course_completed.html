<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Completed | SmartCourse</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #07152f,
                    #0b2448
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }

        .completion-card {
            width: 100%;

            max-width: 720px;

            padding: 55px 40px;

            text-align: center;

            background: #101f3b;

            border:
                1px solid
                rgba(0,217,255,0.25);

            border-radius: 22px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);
        }

        .icon {
            font-size: 70px;

            margin-bottom: 20px;
        }

        h1 {
            color: #00d9ff;

            font-size: 38px;

            margin-bottom: 18px;
        }

        .message {
            color: #dce8f7;

            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 18px;
        }

        .course-name {
            color: white;

            font-size: 25px;

            font-weight: 700;

            margin: 20px 0 30px;
        }

        .success-message {
            color: #27d6a1;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 32px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .btn {
            min-width: 190px;

            padding: 14px 22px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            color: #06152d;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #008cff
                );

            transition: 0.25s;
        }

        .btn.secondary {
            color: white;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.18);
        }

        .btn:hover {
            transform:
                translateY(-3px);
        }

        @media (max-width: 600px) {

            .completion-card {
                padding: 40px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .message {
                font-size: 16px;
            }

            .course-name {
                font-size: 21px;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <main class="completion-card">

        <div class="icon">

            🎉

        </div>


        <h1>

            Congratulations!

        </h1>


        <p class="message">

            You have successfully completed
            the selected course.

        </p>


        <div class="course-name">

            {{ course['Course'] }}

        </div>


        <p class="success-message">

            🏆 All lessons have been completed successfully!

        </p>


        <div class="buttons">


            <a
                href="{{ url_for('all_courses') }}"
                class="btn">

                📚 Explore More Courses

            </a>


            <a
                href="{{ url_for('dashboard') }}"
                class="btn secondary">

                🏠 Dashboard

            </a>


        </div>

    </main>

</body>

</html>
