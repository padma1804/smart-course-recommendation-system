<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Enrollment</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="recommend-bg">

<header>
<h1>🎓 Smart Course Recommendation System</h1>
</header>

<nav>
<a href="/">Home</a>
<a href="/recommendation/{{ course }}">Courses</a>
<a href="/logout">Logout</a>
</nav>

<div class="login-container">

<h1>📚 Course Enrollment</h1>

<form method="POST">

<label>Course Name</label>

<input
type="text"
value="{{ course }}"
readonly>

<label>Full Name</label>

<input
type="text"
name="fullname"
value="{{ fullname }}"
required>

<label>Email</label>

<input
type="email"
name="email"
required>

<label>Phone Number</label>

<input
type="text"
name="phone"
required>

<label>Preferred Start Date</label>

<input
type="date"
name="start_date"
required>

<br><br>

<button type="submit">

✅ Enroll Now

</button>

</form>

</div>

</body>
</html>
