<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | SmartCourse</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =====================================================
           REGISTER PAGE
        ===================================================== */

        body.register-page {

            min-height: 100vh;

            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(3, 10, 25, 0.88),
                    rgba(3, 10, 25, 0.88)
                ),
                url("../images/background.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            color: white;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .register-header {

            width: 100%;

            min-height: 75px;

            padding: 0 6%;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    90deg,
                    #09245a,
                    #0b3478
                );

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);

        }


        .register-logo {

            color: white;

            font-size: 26px;

            font-weight: 700;

        }


        .register-logo span {

            color: #00d9ff;

        }


        .register-home {

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 9px;

            border:
                1px solid
                rgba(255,255,255,0.20);

            transition: .2s;

        }


        .register-home:hover {

            color: #00d9ff;

            border-color: #00d9ff;

            background:
                rgba(0,217,255,0.08);

        }


        /* =====================================================
           REGISTER WRAPPER
        ===================================================== */

        .register-wrapper {

            min-height:
                calc(100vh - 75px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            box-sizing: border-box;

        }


        /* =====================================================
           REGISTER CARD
        ===================================================== */

        .register-card {

            width: 100%;

            max-width: 470px;

            padding: 40px;

            box-sizing: border-box;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.35);

            backdrop-filter:
                blur(14px);

            animation:
                registerAppear .6s ease;

        }


        @keyframes registerAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           ICON
        ===================================================== */

        .register-icon {

            width: 70px;

            height: 70px;

            margin:
                0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0,217,255,0.10);

            border:
                1px solid
                rgba(0,217,255,0.30);

            font-size: 32px;

        }


        /* =====================================================
           TITLE
        ===================================================== */

        .register-card h1 {

            margin: 0;

            color: white;

            text-align: center;

            font-size: 32px;

        }


        .register-subtitle {

            margin:
                10px 0 28px;

            color: #9eafc4;

            text-align: center;

            font-size: 15px;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .register-form {

            margin: 0;

        }


        .register-input-group {

            margin-bottom: 19px;

        }


        .register-input-group label {

            display: block;

            margin-bottom: 8px;

            color: #dce8f5;

            font-size: 14px;

            font-weight: 600;

        }


        .register-input-wrapper {

            position: relative;

            width: 100%;

        }


        /* =====================================================
           INPUT BOX
        ===================================================== */

        .register-input-group input {

            width: 100%;

            height: 50px;

            padding:
                0 50px 0 16px;

            box-sizing: border-box;

            color: #111827;

            background: #eef4ff;

            border:
                1px solid
                rgba(255,255,255,0.16);

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            transition: .2s;

        }


        .register-input-group input::placeholder {

            color: #718096;

        }


        .register-input-group input:focus {

            border-color:
                #00d9ff;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(0,217,255,0.12);

        }


        /* =====================================================
           SHOW PASSWORD BUTTON
        ===================================================== */

        .register-show-password {

            position: absolute !important;

            right: 10px !important;

            top: 50% !important;

            transform:
                translateY(-50%) !important;

            width: 34px !important;

            height: 34px !important;

            padding: 0 !important;

            margin: 0 !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            color: #64748b !important;

            background:
                transparent !important;

            border: none !important;

            box-shadow: none !important;

            font-size: 17px !important;

            line-height: 1 !important;

            cursor: pointer !important;

            z-index: 5 !important;

        }


        .register-show-password:hover {

            color: #008cff !important;

            background:
                transparent !important;

            border: none !important;

            transform:
                translateY(-50%) !important;

            box-shadow: none !important;

        }


        /* =====================================================
           PASSWORD STRENGTH
        ===================================================== */

        .password-strength {

            height: 4px;

            margin-top: 8px;

            background: #24364f;

            border-radius: 10px;

            overflow: hidden;

        }


        .password-strength-bar {

            width: 0%;

            height: 100%;

            background: #00d9ff;

            transition: .3s;

        }


        .password-hint {

            margin-top: 6px;

            color: #71839a;

            font-size: 12px;

        }


        /* =====================================================
           REGISTER BUTTON
        ===================================================== */

        .register-submit {

            width: 100% !important;

            height: 50px !important;

            margin-top: 8px !important;

            padding: 0 !important;

            border: none !important;

            border-radius: 10px !important;

            color: white !important;

            background:
                linear-gradient(
                    135deg,
                    #00c3ff,
                    #008cff
                ) !important;

            font-size: 16px !important;

            font-weight: 700 !important;

            cursor: pointer !important;

            box-shadow:
                0 7px 20px
                rgba(0,195,255,0.18) !important;

            transition: .2s !important;

        }


        .register-submit:hover {

            transform:
                translateY(-2px) !important;

            box-shadow:
                0 10px 25px
                rgba(0,195,255,0.30) !important;

        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-text {

            margin-top: 23px;

            color: #899bb1;

            text-align: center;

            font-size: 14px;

        }


        .login-text a {

            color: #00d9ff;

            text-decoration: none;

            font-weight: 700;

        }


        .login-text a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .register-footer {

            margin-top: 20px;

            color: #63758c;

            text-align: center;

            font-size: 12px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 600px) {

            .register-header {

                padding:
                    0 20px;

            }


            .register-logo {

                font-size: 21px;

            }


            .register-home {

                padding:
                    8px 13px;

                font-size: 13px;

            }


            .register-card {

                padding:
                    30px 22px;

            }


            .register-card h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body class="register-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="register-header">


    <div class="register-logo">

        🎓 Smart<span>Course</span>

    </div>


    <a href="/"
       class="register-home">

        ← Home

    </a>


</header>


<!-- =====================================================
     REGISTER CONTENT
===================================================== -->

<div class="register-wrapper">


    <div class="register-card">


        <div class="register-icon">

            👤

        </div>


        <h1>

            Create Account

        </h1>


        <p class="register-subtitle">

            Start your personalized learning journey

        </p>


        <form method="POST"
              action="/register"
              class="register-form">


            <!-- =================================================
                 FULL NAME
            ================================================== -->

            <div class="register-input-group">


                <label for="fullname">

                    Full Name

                </label>


                <div class="register-input-wrapper">


                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name">


                </div>


            </div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="register-input-group">


                <label for="email">

                    Email Address

                </label>


                <div class="register-input-wrapper">


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email">


                </div>


            </div>


            <!-- =================================================
                 PASSWORD
            ================================================== -->

            <div class="register-input-group">


                <label for="password">

                    Password

                </label>


                <div class="register-input-wrapper">


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        oninput="checkPasswordStrength()">


                    <button
                        type="button"
                        class="register-show-password"
                        onclick="togglePassword()"
                        aria-label="Show password">

                        👁️

                    </button>


                </div>


                <div class="password-strength">


                    <div id="strengthBar"
                         class="password-strength-bar">

                    </div>


                </div>


                <p class="password-hint">

                    Use at least 6 characters.

                </p>


            </div>


            <!-- =================================================
                 CONFIRM PASSWORD
            ================================================== -->

            <div class="register-input-group">


                <label for="confirm_password">

                    Confirm Password

                </label>


                <div class="register-input-wrapper">


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                        autocomplete="new-password">


                </div>


            </div>


            <!-- =================================================
                 REGISTER
            ================================================== -->

            <button
                type="submit"
                class="register-submit">

                Create Account →

            </button>


        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <p class="login-text">

            Already have an account?

            <a href="/login">

                Login here

            </a>

        </p>


        <div class="register-footer">

            Smart Course Recommendation System

        </div>


    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword() {


    const password =
        document.getElementById(
            "password"
        );


    const button =
        document.querySelector(
            ".register-show-password"
        );


    if (
        password.type === "password"
    ) {

        password.type =
            "text";

        button.innerText =
            "🙈";

    }

    else {

        password.type =
            "password";

        button.innerText =
            "👁️";

    }

}


/* =====================================================
   PASSWORD STRENGTH
===================================================== */

function checkPasswordStrength() {


    const password =
        document.getElementById(
            "password"
        ).value;


    const bar =
        document.getElementById(
            "strengthBar"
        );


    let strength = 0;


    if (
        password.length >= 6
    ) {

        strength += 25;

    }


    if (
        password.length >= 8
    ) {

        strength += 25;

    }


    if (
        /[A-Z]/.test(password)
    ) {

        strength += 20;

    }


    if (
        /[0-9]/.test(password)
    ) {

        strength += 15;

    }


    if (
        /[^A-Za-z0-9]/.test(password)
    ) {

        strength += 15;

    }


    bar.style.width =
        strength + "%";

}

</script>


</body>

</html>
